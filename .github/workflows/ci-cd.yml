name: CI/CD 自动化部署流程

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 项目配置
  APP_NAME: llm-afs
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  
  # Docker配置 - 阿里云容器镜像服务
  REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  IMAGE_NAME_SERVER: ${{ secrets.ALIYUN_ACR_NAMESPACE }}/afs-server
  IMAGE_NAME_WEB: ${{ secrets.ALIYUN_ACR_NAMESPACE }}/afs-web
  
  # 环境变量
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: afs
  AI_DASHSCOPE_MODEL: qwen3.8-flash

jobs:
  # ==================== 构建阶段 ====================
  build:
    name: 构建应用
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 构建后端
      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 测试并打包后端
        working-directory: ./afs-server
        run: mvn -B clean package

      # 构建前端
      - name: 配置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: afs-web/package.json

      - name: 安装前端依赖
        working-directory: ./afs-web
        run: npm install

      - name: 前端代码检查
        working-directory: ./afs-web
        run: npm run lint

      - name: 构建 Vue 前端
        working-directory: ./afs-web
        run: npm run build

      # 上传构建产物
      - name: 上传后端 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: afs-server/target/*.jar
          retention-days: 1

      - name: 上传前端静态文件
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: afs-web/dist
          retention-days: 1

  # ==================== Docker构建与推送 ====================
  docker-build:
    name: 构建并推送Docker镜像
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 需要阿里云 ACR 凭据，push 与手动触发都会推送镜像
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 下载构建产物
      - name: 下载后端 JAR 包
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: afs-server/target/

      - name: 下载前端静态文件
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: afs-web/dist/

      # Docker配置
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 构建后端镜像
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./afs-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 阿里云 ACR 个人版不识别 OCI 空描述符（application/vnd.oci.empty.v1.json），需关闭证明与 SBOM
          provenance: false
          sbom: false

      # 构建前端镜像
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./afs-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 同后端镜像，关闭证明与 SBOM 以兼容 ACR 个人版
          provenance: false
          sbom: false

      # 输出镜像信息
      - name: 输出镜像标签
        run: |
          echo "后端镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ github.sha }}"
          echo "前端镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}"

  # ==================== 部署到服务器 ====================
  deploy:
    name: 部署到生产服务器
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 需要目标服务器，手动触发并勾选 deploy 时才执行
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    # 同一时间只允许一个部署任务，避免连续提交时并发覆盖线上
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 创建服务器目录
      - name: 创建部署目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p ${{ secrets.SERVER_PROJECT_PATH }}/${{ env.APP_NAME }}

      # 上传配置文件
      - name: 上传 docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.SERVER_PROJECT_PATH }}/${{ env.APP_NAME }}/

      # 执行部署
      - name: 执行服务器部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          timeout: 3600s # 总会话超时：30分钟（全局）
          command_timeout: 3000s # 单条命令超时：20分钟
          script_stop: true # 任一命令失败立即终止，避免失败被后续命令掩盖
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }}/${{ env.APP_NAME }}

            # 记录上一版镜像 tag，用于部署失败时回滚
            PREV_TAG=$(grep -E '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || true)
            echo "当前运行版本: ${PREV_TAG:-无}"

            # 登录阿里云容器镜像服务
            echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin

            # 生成 .env 文件；引号防止服务器侧对密码中的 $ 二次展开
            cat > .env << 'EOF'
            IMAGE_TAG=${{ github.sha }}
            REGISTRY=${{ env.REGISTRY }}
            IMAGE_NAME_SERVER=${{ env.IMAGE_NAME_SERVER }}
            IMAGE_NAME_WEB=${{ env.IMAGE_NAME_WEB }}
            POSTGRES_USER=${{ env.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ env.POSTGRES_DB }}
            AI_DASHSCOPE_API_KEY=${{ secrets.AI_DASHSCOPE_API_KEY }}
            AI_DASHSCOPE_MODEL=${{ env.AI_DASHSCOPE_MODEL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            chmod 600 .env

            # 拉取最新镜像
            docker compose -f docker-compose.prod.yml pull

            # 启动并等待各容器健康检查通过
            if ! docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600; then
              echo "新版本启动失败，尝试回滚"
              if [ -n "$PREV_TAG" ]; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" .env
                docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600 || true
                echo "已回滚到 ${PREV_TAG}"
              fi
              exit 1
            fi

            # 断言后端健康端点，非 200 直接失败
            curl -fsS http://localhost:8080/actuator/health
            echo ""
            docker compose -f docker-compose.prod.yml ps

            # 清理
            docker image prune -f

            echo "部署成功！"

  # ==================== 通知 ====================
  notify:
    name: 发送部署通知
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.event_name == 'workflow_dispatch' && inputs.deploy
    steps:
      - name: 检查部署状态
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "部署成功！"
          else
            echo "部署失败！"
            exit 1
          fi