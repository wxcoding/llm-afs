# AFS 生产环境 Docker Compose 配置
#
# 仅用于生产：镜像来自阿里云 ACR，不包含 build 段
# 使用方式: 在部署目录放置 .env 后执行 docker compose -f docker-compose.prod.yml up -d
# 本地开发使用 docker-compose.yml

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: afs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 使用 Flyway 进行数据库迁移，无需单独挂载 schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afs-network

  redis:
    image: redis:7-alpine
    container_name: afs-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afs-network

  afs-server:
    image: ${REGISTRY:-local}/${IMAGE_NAME_SERVER:-afs-server}:${IMAGE_TAG:-latest}
    container_name: afs-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL:-qwen3.8-max-0902}
      # 必填，缺失时启动直接报错，避免回退到仓库中的默认弱密钥
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 生产环境输出 JSON 结构化日志（接入 ELK/Loki 采集）
      SPRING_PROFILES_ACTIVE: json-log
      # 生产环境默认关闭 API 文档
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m}
      # 前后端同域由 nginx 反代，默认无需 CORS；如需跨域部署再通过环境变量注入
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
#      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afs-network

  afs-web:
    image: ${REGISTRY:-local}/${IMAGE_NAME_WEB:-afs-web}:${IMAGE_TAG:-latest}
    container_name: afs-web
    restart: always
    depends_on:
      - afs-server
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      # 用 127.0.0.1 而非 localhost：alpine 容器内 localhost 解析到 ::1，nginx 只监听 IPv4，wget 会 Connection refused
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - afs-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  afs-network:
    driver: bridge