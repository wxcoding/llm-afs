server:
  port: 8080

spring:
  # 本地开发使用的数据库连接；部署环境通过环境变量覆盖。
  datasource:
    url: jdbc:postgresql://localhost:5432/afs?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:guanwx}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  cache:
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  ai:
    # 仅对限流和服务端错误重试；鉴权、参数等 4xx 错误不重试。
    retry:
      max-attempts: 3
      on-client-errors: false
      on-http-codes: 429
      backoff:
        initial-interval: 5000
        multiplier: 2
        max-interval: 30000
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY}
#      base-url: https://dashscope.aliyuncs.com/compatible-mode
      base-url: https://llm-oyswq13b7aipovuo.cn-beijing.maas.aliyuncs.com/compatible-mode
      chat:
        options:
          model: ${AI_DASHSCOPE_MODEL:qwen4-max}
          temperature: 0.7
          max-tokens: 2000
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
      # 外部 AI 请求超时，避免慢响应长时间占用请求线程。
      client:
        http:
          connect-timeout: 5000
          read-timeout: 60000
          write-timeout: 30000
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        filter: true
      # PostgreSQL 全文检索与向量检索的融合参数。
      hybrid-search:
        enabled: true
        query-expansion: true
        max-expansion-queries: 5
        vector-top-k: 20
        keyword-top-k: 20
    # 所选 ReRank 服务需要配置对应的 API Key。
    rerank:
      enabled: true
      provider: dashscope
      candidate-top-k: 20
      top-n: 5
      dashscope:
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
        api-key: ${AI_DASHSCOPE_API_KEY:}
        model: qwen3.7-text-rerank
      jina:
        endpoint: https://api.jina.ai/v1/rerank
        api-key: ${JINA_API_KEY:}
      cohere:
        endpoint: https://api.cohere.ai/v1/rerank
        api-key: ${COHERE_API_KEY:}

# RAG 检索与引用配置。
rag:
  # 超时后检索降级为纯模型回答。
  search-timeout-seconds: 10
  # 向量检索超时后改用全文检索。
  vector-timeout-seconds: 5
  citation:
    # 低于阈值的检索结果不展示为引用；设为 0 可关闭筛选。
    min-score: 0.35

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 通过 SLF4J 输出 SQL 日志，便于按环境统一控制日志级别。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 默认密钥仅供本地开发；生产环境必须设置强随机 JWT_SECRET。
jwt:
  secret: ${JWT_SECRET:afs-jwt-secret-please-change-in-production-0123456789}
  expire-hours: 72

# 登录失败计数与锁定时长（基于 Redis）。
security:
  login:
    max-failures: 5
    lock-seconds: 600

# 生产环境由部署配置关闭 API 文档。
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: afs-server

# /actuator/info 展示的应用信息。
info:
  app:
    name: afs-server
    description: 智能防诈骗系统后端
    version: 1.0.0
# 开发环境日志级别；容器环境通过 json-log profile 输出结构化日志。
logging:
  level:
    com.afs: DEBUG
    org.springframework.ai: WARN
    org.springframework.ai.retry: DEBUG
