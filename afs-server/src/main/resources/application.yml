server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/afs?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:guanwx}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: ${AI_DASHSCOPE_MODEL:qwen3.8-flash}
          temperature: 0.7
          max-tokens: 2000
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
      # 重试配置
      retry:
        max-attempts: 3              # 最多重试3次
        backoff:
          initial-interval: 5000     # 初始等待5秒（避开限流恢复窗口）
          multiplier: 2              # 指数退避：5s → 10s → 20s
          max-interval: 30000        # 最大等待30秒
      # HTTP客户端超时配置
      client:
        http:
          connect-timeout: 5000      # 连接超时5秒
          read-timeout: 60000        # 读取超时60秒（Embedding可能较慢）
          write-timeout: 30000       # 写入超时30秒
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        filter: true  # 启用 FilterExpression 支持（Spring AI 1.1.7）
      # 混合检索配置（PostgreSQL 全文检索 + 向量）
      hybrid-search:
        enabled: true  # 是否启用混合检索
        query-expansion: true  # 是否启用查询扩展
        max-expansion-queries: 5  # 单次检索最多执行的关键词扩展查询数
        vector-top-k: 20  # 向量检索返回数量
        keyword-top-k: 20  # 全文检索返回数量
        # 召回候选数由调用方决定：未启用重排时使用请求 topK，启用重排时使用 rerank.candidate-top-k
    # ReRank 重排序配置
    rerank:
      enabled: true  # 是否启用 ReRank
      provider: dashscope  # Provider: dashscope / jina / cohere / mock
      candidate-top-k: 20  # 启用重排时的最小召回候选数
      top-n: 5  # 重排后最终保留数量
      dashscope:
        endpoint: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
        api-key: ${AI_DASHSCOPE_API_KEY:}
        model: qwen3.7-text-rerank
      jina:
        endpoint: https://api.jina.ai/v1/rerank
        api-key: ${JINA_API_KEY:}
      cohere:
        endpoint: https://api.cohere.ai/v1/rerank
        api-key: ${COHERE_API_KEY:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志统一走 slf4j，由 logback 按环境控制级别
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 登录鉴权配置
jwt:
  # 生产环境务必通过环境变量覆盖
  secret: ${JWT_SECRET:afs-jwt-secret-please-change-in-production-0123456789}
  expire-hours: 72

# 登录防爆破策略（基于 Redis 计数，窗口到期自动解锁）
security:
  login:
    max-failures: 5      # 连续失败 5 次后锁定
    lock-seconds: 600    # 锁定时长 10 分钟

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: afs-server

info:
  app:
    name: afs-server
    description: 智能防诈骗系统后端
    version: 1.0.0


logging:
  level:
    root: INFO
    com.afs: DEBUG
    org.springframework.ai: WARN
    org.springframework.ai.retry: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
